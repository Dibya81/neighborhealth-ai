# NeighborHealth 2.0: full stack
#   docker compose up --build             # db, redis, api, alerts worker, web
#   docker compose --profile mlops up     # + MLflow tracking server
#   docker compose run --rm api python -m ml weekly   # refresh data, retrain, publish
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nh
      POSTGRES_PASSWORD: nh
      POSTGRES_DB: neighborhealth
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nh -d neighborhealth"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [apps/api/.env]
    environment:
      DATABASE_URL: postgresql://nh:nh@db:5432/neighborhealth
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:3000
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    volumes: [nhdata:/repo/data/v2]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["python", "-m", "app.services.alerts.worker"]
    env_file: [apps/api/.env]
    environment:
      DATABASE_URL: postgresql://nh:nh@db:5432/neighborhealth
      REDIS_URL: redis://redis:6379/0
    volumes: [nhdata:/repo/data/v2]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

  mlflow:
    profiles: [mlops]
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes: [mlflowdata:/mlflow]
    ports: ["5000:5000"]

volumes:
  pgdata:
  redisdata:
  nhdata:
  mlflowdata:
